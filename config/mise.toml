# Global mise config (linked to ~/.config/mise/config.toml)
# Node: latest LTS. Everything else: latest stable.
# CLI tools listed here are installed by modules via `mise use -g`.

[tools]
node = "lts"
python = "latest"
go = "latest"
rust = "latest"
ruby = "latest"
# Elixir needs Erlang/OTP on PATH
erlang = "latest"
elixir = "latest"
fnox = "latest"
hk = "latest"
lazydocker = "latest"
bottom = "latest"
btop = "latest"
dust = "latest"
dua = "latest"
ast-grep = "latest"
gitleaks = "latest"
difftastic = "latest"
"aqua:tummychow/git-absorb" = "latest"
usage = "latest"
aube = "latest"
# Astral Python DX
uv = "latest"
ruff = "latest"
ty = "latest"
just = "latest"
ripgrep = "latest"
fd = "latest"
fzf = "latest"
bat = "latest"
eza = "latest"
jq = "latest"
yq = "latest"
zoxide = "latest"
starship = "latest"
atuin = "latest"
lazygit = "latest"
delta = "latest"
age = "latest"

[settings]
experimental = true
# Prefer idiomatic version files in project dirs when present
idiomatic_version_file_enable_tools = ["node", "python", "ruby"]
